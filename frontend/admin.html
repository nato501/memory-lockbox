<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการบัญชี - Our Cozy Love Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js?v=4"></script>
</head>
<body class="text-gray-800 flex flex-col items-center justify-start min-h-screen p-3 sm:p-6 selection:bg-rose-500 selection:text-white">
    <div id="lock-screen" class="fixed inset-0 z-50 bg-gradient-to-br from-pink-500/90 via-rose-500/90 to-red-500/90 backdrop-blur-md flex items-center justify-center p-4"></div>
    <div id="main-app" class="w-full max-w-5xl mx-auto flex flex-col flex-grow pb-12">
        <header class="bg-white/80 backdrop-blur-md rounded-3xl p-4 sm:p-6 shadow-xl border border-pink-100 mb-6">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-4">
                <div class="flex items-center space-x-3"><div class="w-12 h-12 bg-gradient-to-tr from-amber-400 to-orange-400 rounded-2xl flex items-center justify-center text-white text-2xl shadow-md">🛡️</div><div><h1 class="text-lg sm:text-xl font-bold text-gray-800">จัดการบัญชี</h1><p class="text-xs text-gray-500">สำหรับผู้ดูแลระบบเท่านั้น</p></div></div>
                <button onclick="lockApp()" class="bg-pink-100 hover:bg-pink-200 text-[#E11D48] px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shadow-2xs"><i data-lucide="log-out" class="w-3.5 h-3.5"></i><span>ออกจากระบบ</span></button>
            </div>
            <nav class="main-nav flex gap-2 pt-2 border-t border-pink-100 overflow-x-auto pb-1">
                <a href="counter.html" class="tab-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-2xl font-bold text-xs bg-pink-50 text-gray-600 hover:bg-pink-100 transition"><i data-lucide="heart" class="w-4 h-4"></i><span>1. นับวันรัก</span></a>
                <a href="index.html" class="tab-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-2xl font-bold text-xs bg-pink-50 text-gray-600 hover:bg-pink-100 transition"><i data-lucide="calendar-heart" class="w-4 h-4"></i><span>2. วันสำคัญ</span></a>
                <a href="bulletin.html" class="tab-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-2xl font-bold text-xs bg-pink-50 text-gray-600 hover:bg-pink-100 transition"><i data-lucide="sticky-note" class="w-4 h-4"></i><span>3. โพสต์อิท</span></a>
                <a href="games.html" class="tab-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-2xl font-bold text-xs bg-pink-50 text-gray-600 hover:bg-pink-100 transition"><i data-lucide="gamepad-2" class="w-4 h-4"></i><span>4. มุมเกม</span></a>
                <a href="admin.html" data-admin-only class="order-5 tab-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-2xl font-bold text-xs bg-amber-100 text-amber-700 shadow-md transition"><i data-lucide="shield-check" class="w-4 h-4"></i><span>จัดการบัญชี</span></a>
                <a href="profile.html" class="order-6 tab-btn flex items-center justify-center space-x-1.5 py-2.5 px-3 rounded-2xl font-bold text-xs bg-pink-50 text-gray-600 hover:bg-pink-100 transition"><i data-lucide="user-round" class="w-4 h-4"></i><span>โปรไฟล์</span></a>
            </nav>
        </header>
        <main id="admin-content" class="w-full flex-grow">
            <section class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-pink-100 mb-6">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-5"><div><span class="inline-block bg-amber-50 text-amber-700 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-2">Admin Panel</span><h2 class="text-xl font-bold text-gray-700">เพิ่มบัญชีสมาชิก</h2></div><span id="admin-status" class="text-xs text-gray-400"></span></div>
                <form id="account-edit-form" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input id="edit-original-username" type="hidden">
                    <div><label class="block text-xs font-bold text-gray-600 mb-1">ชื่อที่แสดง</label><input id="edit-display-name" type="text" maxlength="40" required class="w-full px-3 py-2.5 text-sm rounded-xl border border-pink-200 focus:outline-none focus:border-rose-500"></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-1">ชื่อผู้ใช้ / อีเมล</label><input id="edit-username" type="text" maxlength="80" required class="w-full px-3 py-2.5 text-sm rounded-xl border border-pink-200 focus:outline-none focus:border-rose-500"></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-1">รหัสผ่าน</label><input id="edit-password" type="text" minlength="4" required class="w-full px-3 py-2.5 text-sm rounded-xl border border-pink-200 focus:outline-none focus:border-rose-500"></div>
                    <div><label class="block text-xs font-bold text-gray-600 mb-1">สิทธิ์</label><select id="edit-role" class="w-full px-3 py-2.5 text-sm rounded-xl border border-pink-200 focus:outline-none focus:border-rose-500"><option value="user">สมาชิก</option><option value="admin">Admin</option></select></div>
                    <div class="sm:col-span-2 flex gap-2"><button type="submit" class="flex-1 bouncy-btn bg-[#E11D48] hover:bg-rose-700 text-white font-bold py-3 rounded-xl text-sm shadow-md transition"><span id="account-submit-label">เพิ่มบัญชี</span> ✨</button><button id="cancel-edit" type="button" class="hidden px-4 py-3 rounded-xl bg-gray-100 text-gray-600 text-sm font-bold">ยกเลิก</button></div>
                    <p id="admin-message" class="sm:col-span-2 text-center text-xs font-medium hidden"></p>
                </form>
            </section>
            <section class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-pink-100"><div class="flex justify-between items-center mb-5"><h2 class="text-xl font-bold text-gray-700">สมาชิกทั้งหมด</h2><span id="account-count" class="text-xs text-gray-400"></span></div><div id="accounts-list" class="space-y-3"></div></section>
        </main>
    </div>
    <script src="admin.js?v=1"></script>
    <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
